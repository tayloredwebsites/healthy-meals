{% extends '_base.html' %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block page_title %}{% trans "Password Reset" %}{% endblock %}
{% block page_h2 %}{% trans "Password Reset" %}{% endblock %}

{% block page_body %}
<form id="pwd_reset_form" method="POST" action="{% url 'account_reset_password' %}" class="password_reset">
    {% csrf_token %}
    {{ form | crispy }}
    <button class="btn btn-primary" type="submit">{% trans "Reset Password" %}</button>
</form>
{% endblock %}
